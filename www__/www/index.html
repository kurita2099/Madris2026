<style>
  /* 2. 画面にフィットさせるための CSS */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000; /* 余白を黒にして違和感を消す */
    overflow: hidden;
  }

  #content {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 1136px;
    /* 画面幅に合わせて強制スケーリング */
    transform: scale(calc(100vw / 640));
    transform-origin: 0 0;
  }
</style>

<script>
  // 3. 一部の古い WebView で calc が効かない場合の保険
  function adjustScale() {
    var screenWidth = window.innerWidth;
    var content = document.getElementById('content');
    if (content && screenWidth > 0) {
      var scale = screenWidth / 640;
      content.style.transform = 'scale(' + scale + ')';
    }
  }
  window.addEventListener('load', adjustScale);
  window.addEventListener('resize', adjustScale);
</script>
